name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23.x", "stable"]

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with randomized order
        run: go test -shuffle=on -count=1 ./...

      - name: Test with race detector and coverage
        if: matrix.go-version == 'stable'
        run: go list ./... | awk '$0 !~ /\/example$/' | xargs go test -race -covermode=atomic -coverprofile=coverage.out

      - name: Enforce coverage floor
        if: matrix.go-version == 'stable'
        run: ./scripts/check-coverage.sh coverage.out 65.0

      - name: Install goveralls
        if: matrix.go-version == 'stable'
        run: go install github.com/mattn/goveralls@v0.0.12

      - name: Send coverage
        if: matrix.go-version == 'stable'
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=coverage.out -service=github
